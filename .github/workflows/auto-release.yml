name: Auto Release

# Releases are commit-driven: every green push to master produces the next
# patch/minor/major version automatically.
#
#   [major]        -> major bump
#   [minor]/feat:  -> minor bump
#   anything else  -> patch bump
#   [skip-release] -> opt out entirely
#
# The workflow bumps internal go.mod requires, commits that, creates one tag
# per module plus a root tag, pushes them, and publishes the GitHub Release.

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: auto-release-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'serv/go.mod'

      # preflight: prove the committed tree compiles before versioning it.
      # Native deps are provisioned here so CI never depends on a developer
      # machine: SQLCipher needs a C toolchain + OpenSSL headers/libraries
      # (dynamic libcrypto.so.3 at runtime).
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      - name: Verify modules compile
        run: go build ./core/... ./serv/...

      - name: Compute next version
        id: next
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          STABLE=$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [[ -z "$STABLE" ]]; then
              # fall back to any version-ish tag (e.g. v3.0.0-pre) stripped of suffixes
              STABLE=$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+' | head -n1 | sed 's/-.*//' || true)
          fi
          [[ -n "$STABLE" ]] || STABLE="v0.1.0"

          MAJOR=$(echo "$STABLE" | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo "$STABLE" | cut -d. -f2)
          PATCH=$(echo "$STABLE" | cut -d. -f3)

          MSG="${COMMIT_MSG:-}"
          case "$MSG" in
              *"[major]"*)
                  MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0;;
              *"[minor]"*|*"feat:"*|*"feat("*|*"feature:"*)
                  MINOR=$((MINOR + 1)); PATCH=0;;
              *)
                  PATCH=$((PATCH + 1));;
          esac

          # Release floor: proxy.golang.org permanently cached old dosco-era
          # zips for every vX <= v3.20.29 on these module paths (a mistaken
          # bulk tag push long ago), so those versions are burned forever.
          # Never publish at or below the floor.
          FLOOR_MAJOR=3; FLOOR_MINOR=33; FLOOR_PATCH=33
          if (( MAJOR < FLOOR_MAJOR )) \
             || (( MAJOR == FLOOR_MAJOR && MINOR < FLOOR_MINOR )) \
             || (( MAJOR == FLOOR_MAJOR && MINOR == FLOOR_MINOR && PATCH < FLOOR_PATCH )); then
              MAJOR=$FLOOR_MAJOR; MINOR=$FLOOR_MINOR; PATCH=$FLOOR_PATCH
          fi

          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "next version: $MAJOR.$MINOR.$PATCH (from $STABLE)"

      - name: Bump internal go.mod requires
        id: bump
        run: |
          OLD_HEAD=$(git rev-parse HEAD)
          echo "base_sha=$OLD_HEAD" >> "$GITHUB_OUTPUT"
          ./release.sh "${{ steps.next.outputs.version }}"
          if git diff --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
          else
              echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version bump
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add core/go.mod serv/go.mod openapi/go.mod webui/go.mod
          git commit -m "chore: bump version to ${{ steps.next.outputs.version }} [skip-release]"

      - name: Push master (race-checked)
        id: push_master
        run: |
          BASE="${{ steps.bump.outputs.base_sha }}"
          git fetch origin master
          REMOTE=$(git rev-parse origin/master)
          if [[ "$REMOTE" != "$BASE" ]]; then
              echo "::error::master advanced from $BASE to $REMOTE during release; aborting"
              exit 1
          fi
          if [[ "${{ steps.bump.outputs.changed }}" == "true" ]]; then
              git push origin HEAD:master
          fi

      - name: Create and push all module tags
        run: |
          set -euo pipefail
          V="${{ steps.next.outputs.version }}"
          TAGS=("core/v$V" "serv/v$V" "sqlite/v$V" "postgres/v$V" "openapi/v$V" "webui/v$V" "v$V")

          for t in "${TAGS[@]}"; do
              git tag -d "$t" >/dev/null 2>&1 || true
              git push origin ":refs/tags/$t" 2>/dev/null || true
              git tag "$t"
          done
          git push origin "${TAGS[@]/#/refs/tags/}"

      - name: Delete existing release if republishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.next.outputs.version }}
        run: gh release delete "v$V" --yes 2>/dev/null || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.next.outputs.version }}
        run: gh release create "v$V" --generate-notes --title "v$V"
