name: Library Release

# Stable releases: push a tag matching vX.Y.Z
# Snapshot releases: run manually; this creates and pushes a timestamped tag,
# whose push event then performs the actual release. The tag is the source of
# truth - this workflow never builds on its own behalf.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'                        # stable (v1.2.3)
      - 'v[0-9]+.[0-9]+.[0-9]+-snapshot.[0-9]+-[0-9]+' # snapshot (v1.2.3-snapshot.20260821-143000)
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'snapshot'
        type: choice
        options:
          - stable
          - snapshot
      tag_name:
        description: 'Tag name (required for stable; snapshot auto-generates when empty)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref_name || github.event.inputs.tag_name || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.cfg.outputs.tag_name }}
      should_release: ${{ steps.cfg.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify event and resolve tag
        id: cfg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          TYPE="${{ github.event.inputs.release_type || '' }}"
          TAG="${{ github.event.inputs.tag_name || '' }}"

          if [[ "$EVENT" == "push" ]]; then
              TAG="${{ github.ref_name }}"

              case "$TAG" in
                  v[0-9]*.[0-9]*.[0-9]*)
                      TYPE="stable"
                      ;;
                  v[0-9]*.[0-9]*.[0-9]*-snapshot.[0-9]*-[0-9]*)
                      TYPE="snapshot"
                      ;;
                  *)
                      echo "::error::Unsupported tag: $TAG"
                      exit 1
                      ;;
              esac

          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
              TYPE="${TYPE:-snapshot}"

              if [[ "$TYPE" == "stable" ]]; then
                  [[ -n "$TAG" ]] || {
                      echo "::error::Stable releases require tag_name"
                      exit 1
                  }
                  [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                      echo "::error::Invalid stable tag: $TAG"
                      exit 1
                  }
              elif [[ "$TYPE" == "snapshot" ]]; then
                  LAST=$(git tag -l --sort=-v:refname \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                      | head -n1 || true)

                  if [[ -z "$LAST" ]]; then
                      TAG="v0.1.0-snapshot.$(date +%Y%m%d-%H%M%S)"
                  else
                      MAJOR=$(echo "$LAST" | cut -d. -f1 | tr -d 'v')
                      MINOR=$(echo "$LAST" | cut -d. -f2)
                      PATCH=$(echo "$LAST" | cut -d. -f3)

                      TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))-snapshot.$(date +%Y%m%d-%H%M%S)"
                  fi
              else
                  echo "::error::Unknown release type: $TYPE"
                  exit 1
              fi

              git config user.name "${GITHUB_ACTOR}"
              git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

              if git rev-parse "$TAG" >/dev/null 2>&1 || \
                 git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
                  echo "::error::Tag $TAG already exists; delete it first or pick another name"
                  exit 1
              fi

              git tag -a "$TAG" -m "$TAG: $TYPE release [created-by-release-workflow]"
              git push origin "$TAG"

              # the tag push event performs the actual release
              echo "created and pushed tag $TAG; release handled by tag-push run"
              echo "tag_name=$TAG"     >> "$GITHUB_OUTPUT"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0

          else
              echo "::error::Unsupported event: $EVENT"
              exit 1
          fi

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: config
    if: needs.config.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'serv/go.mod'

      - name: Install GoReleaser
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends goreleaser

      - name: Verify modules compile from committed sources
        run: |
          # library consumers need no submodules and no C toolchain setup;
          # prove our module tree is complete.
          go build ./core/... ./serv/...

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --config .goreleaser.yaml
