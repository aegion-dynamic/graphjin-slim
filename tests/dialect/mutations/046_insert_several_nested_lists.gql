# Several nested lists in one insert, one of them a child whose primary key
# is composite. Each list is one CTE, whatever the child's key.
#
# Before the fix every element of an inline list took an id of its own but
# the next list started one id later, so the lists shared ids and names:
#
#     ERROR: WITH query name "event_term_links" specified more than once
#
# expect: {"note": "first"}
mutation {
  events(
    insert: {
      slug: "probe-several-lists"
      title: "Probe several lists"
      host_user_id: "11111111-1111-1111-1111-000000000001"
      status: "draft"
      format: "in_person"
      participation_type: "open"
      registrations: [
        { name: "Probe One", email: "one@example.org" }
        { name: "Probe Two", email: "two@example.org" }
      ]
      event_term_links: [
        { term_id: "77777777-7777-7777-7777-000000000001", note: "first" }
        { term_id: "77777777-7777-7777-7777-000000000002", note: "second" }
      ]
    }
  ) {
    slug
    registrations {
      name
    }
    event_term_links {
      note
    }
  }
}
