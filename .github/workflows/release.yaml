name: Library Release

# Stable releases: push a tag matching vX.Y.Z
# Snapshot releases: run manually; this creates and pushes a timestamped tag,
# then publishes its GitHub Release directly.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'                        # stable (v1.2.3)
      - 'v[0-9]+.[0-9]+.[0-9]+-snapshot.[0-9]+-[0-9]+' # snapshot (v1.2.3-snapshot.20260821-204941)
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'snapshot'
        type: choice
        options:
          - stable
          - snapshot
      tag_name:
        description: 'Tag name (required for stable; snapshot auto-generates when empty)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref_name || github.event.inputs.tag_name || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and type
        id: cfg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          TYPE="${{ github.event.inputs.release_type || '' }}"
          TAG="${{ github.event.inputs.tag_name || '' }}"

          if [[ "$EVENT" == "push" ]]; then
              TAG="${{ github.ref_name }}"
              case "$TAG" in
                  v[0-9]*.[0-9]*.[0-9]*)
                      TYPE="stable"
                      ;;
                  v[0-9]*.[0-9]*.[0-9]*-snapshot.[0-9]*-[0-9]*)
                      TYPE="snapshot"
                      ;;
                  *)
                      echo "::error::Unsupported tag: $TAG"
                      exit 1
                      ;;
              esac

          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
              TYPE="${TYPE:-snapshot}"

              if [[ "$TYPE" == "stable" ]]; then
                  [[ -n "$TAG" ]] || {
                      echo "::error::Stable releases require tag_name"
                      exit 1
                  }
                  [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                      echo "::error::Invalid stable tag: $TAG"
                      exit 1
                  }
              elif [[ "$TYPE" == "snapshot" ]]; then
                  LAST=$(git tag -l --sort=-v:refname \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                      | head -n1 || true)

                  if [[ -z "$LAST" ]]; then
                      TAG="v0.1.0-snapshot.$(date +%Y%m%d-%H%M%S)"
                  else
                      MAJOR=$(echo "$LAST" | cut -d. -f1 | tr -d 'v')
                      MINOR=$(echo "$LAST" | cut -d. -f2)
                      PATCH=$(echo "$LAST" | cut -d. -f3)

                      TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))-snapshot.$(date +%Y%m%d-%H%M%S)"
                  fi

                  git config user.name "${GITHUB_ACTOR}"
                  git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
                  if git rev-parse "$TAG" >/dev/null 2>&1 || \
                     git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
                      echo "::error::Tag $TAG already exists; delete it first or pick another name"
                      exit 1
                  fi
                  git tag -a "$TAG" -m "$TAG: snapshot release"
                  git push origin "$TAG"
              else
                  echo "::error::Unknown release type: $TYPE"
                  exit 1
              fi
          else
              echo "::error::Unsupported event: $EVENT"
              exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'serv/go.mod'

      # prove the committed tree compiles standalone (no submodules needed)
      - name: Verify modules compile
        run: go build ./core/... ./serv/...

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cfg.outputs.tag }}
          TYPE: ${{ steps.cfg.outputs.type }}
        run: |
          ARGS=( "$TAG" --generate-notes --title "$TAG" )
          if [[ "$TYPE" == "snapshot" ]]; then
              ARGS+=( --prerelease )
          fi
          gh release create "${ARGS[@]}"
